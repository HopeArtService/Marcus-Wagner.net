<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: white;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Top centered buttons */
.links {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 10;
  align-items: center;
}

.links a {
  padding: 8px 16px;
  font-size: 0.9rem;
  text-decoration: none;
  color: white;
  background: rgba(0,0,0,0.4);
  border-radius: 5px;
}

/* Center image */
.hero-content {
  display: flex;
  justify-content: center;
  align-items: center;
}

.main-image {
  width: 280px;
  height: auto;
  object-fit: contain;
}

@media (max-width: 768px) {
  .main-image {
    width: 140px;
  }
}

.side-image-link {
  position: fixed;
  right: 10px;   /* moved closer to center (was 20px) */
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
}

.side-image-link img {
  width: 240px;  /* doubled from 120px */
  height: auto;
  object-fit: contain;
  opacity: 0.9;
  transition: opacity 0.2s ease;
}

.side-image-link img:hover {
  opacity: 1;
}

@media (max-width: 768px) {
  .side-image-link img {
    width: 70px;
  }
}

/* INFO */
.info {
  max-width: 700px;
  margin: 80px auto;
  padding: 0 20px;
  font-family: "Times New Roman", serif;
  text-align: left;
}

.info p {
  margin: 0 0 12px 0;
}

.info a {
  display: block;
  margin: 10px 0;
  color: red;
  text-decoration: none;
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">

  <div class="links">
    <a href="art.html">Archive</a>
    <a href="info.html">Contact</a>
  </div>

  <!-- MAIN IMAGE -->
  <div class="hero-content">
    <img id="randomImage" class="main-image" alt="Artwork">
  </div>

  <!-- RIGHT SIDE LINK IMAGE -->
  <a href="https://www.hopeartservice.vip" class="side-image-link">
    <img src="src/hopewetrust.png" alt="Side Link">
  </a>

</section>

<script>
  const images = [
    "src/ternitzportrait1.JPG",
    "src/painting_compilation/spagetti.jpg",
    "src/ghosttown2.jpg",
    "src/leibes_2.jpg",
    "src/works_on_paper_other26.jpg"
  ];

  const img = document.getElementById("randomImage");
  const randomIndex = Math.floor(Math.random() * images.length);
  img.src = images[randomIndex];
</script>

</body>
</html>
