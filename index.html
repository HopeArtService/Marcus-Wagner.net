<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  overflow: hidden;
  background: black;
}

/* FULLSCREEN BACKGROUND */
.hero {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;

  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;

  cursor: pointer;
}

/* Top centered buttons */
.links {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 10;
  align-items: center;
}

.links a {
  padding: 8px 16px;
  font-size: 0.9rem;
  text-decoration: none;
  color: white;
  background: rgba(0,0,0,0.4);
  border-radius: 5px;
}
</style>
</head>

<body>

<!-- BACKGROUND HERO -->
<section class="hero" id="hero"></section>

<div class="links">
  <a href="art.html">Archive</a>
  <a href="info.html">Contact</a>
</div>

<script>
const images = [
  "src/ternitzportrait1.JPG",
  "src/painting_compilation/spagetti.jpg",
  "src/ghosttown2.jpg",
  "src/leibes_2.jpg",
  "src/works_on_paper_other26.jpg"
];

let index = Math.floor(Math.random() * images.length);

const hero = document.getElementById("hero");

// set initial background
hero.style.backgroundImage = `url('${images[index]}')`;

// click to change image
hero.addEventListener("click", () => {
  index = (index + 1) % images.length;
  hero.style.backgroundImage = `url('${images[index]}')`;
});
</script>

</body>
</html>
