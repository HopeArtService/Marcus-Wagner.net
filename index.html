<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: white;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Top centered buttons */
.links {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 10;
  align-items: center;
}

.links a {
  padding: 8px 16px;
  font-size: 0.9rem;
  text-decoration: none;
  color: white;
  background: rgba(0,0,0,0.4);
  border-radius: 5px;
}

/* WRAPPER (main + side image together) */
.hero-wrap {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 60px;
}

/* Center image */
.main-image {
  width: 280px;
  height: auto;
  object-fit: contain;
  cursor: pointer;
}

/* SIDE IMAGE (desktop) */
.side-image-link {
  display: block;
}

.side-image-link img {
  width: 240px;
  height: auto;
  object-fit: contain;
  opacity: 0.9;
  transition: opacity 0.2s ease;
}

.side-image-link img:hover {
  opacity: 1;
}

/* MOBILE LAYOUT */
@media (max-width: 768px) {

  .hero-wrap {
    flex-direction: column; /* stack vertically */
    gap: 20px;
  }

  .main-image {
    width: 140px;
  }

  .side-image-link img {
    width: 160px;
  }
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">

  <div class="links">
    <a href="art.html">Archive</a>
    <a href="info.html">Contact</a>
  </div>

  <div class="hero-wrap">

    <!-- MAIN IMAGE -->
    <img id="randomImage" class="main-image" alt="Artwork">

    <!-- SIDE IMAGE -->
    <a href="https://www.hopeartservice.vip" class="side-image-link">
      <img src="src/hopewetrust.png" alt="Side Link">
    </a>

  </div>

</section>

<script>
  const images = [
    "src/ternitzportrait1.JPG",
    "src/painting_compilation/spagetti.jpg",
    "src/ghosttown2.jpg",
    "src/leibes_2.jpg",
    "src/works_on_paper_other26.jpg"
  ];

  let index = Math.floor(Math.random() * images.length);
  const img = document.getElementById("randomImage");

  img.src = images[index];

  // click to change image
  img.addEventListener("click", () => {
    index = (index + 1) % images.length;
    img.src = images[index];
  });
</script>

</body>
</html>
