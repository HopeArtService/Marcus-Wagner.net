<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: white;
}

/* HERO */
.hero {
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  position: relative;
}

/* Top centered buttons */
.links {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 10;
  align-items: center;
}

.links a {
  padding: 8px 16px;
  font-size: 0.9rem;
  text-decoration: none;
  color: white;
  background: rgba(0,0,0,0.4);
  border-radius: 5px;
}

/* CENTER IMAGE (always truly centered) */
.main-image {
  width: 280px;
  height: auto;
  object-fit: contain;
  cursor: pointer;
}

@media (max-width: 768px) {
  .main-image {
    width: 140px;
  }
}

/* SIDE IMAGE (does NOT affect centering) */
.side-image-link {
  position: absolute;
  right: 60px;
  top: 50%;
  transform: translateY(-50%);
  z-index: 10;
}

.side-image-link img {
  width: 240px;
  height: auto;
  object-fit: contain;
  opacity: 0.9;
  transition: opacity 0.2s ease;
}

.side-image-link img:hover {
  opacity: 1;
}

/* MOBILE STACK */
@media (max-width: 768px) {

  .side-image-link {
    position: static;
    transform: none;
    margin-top: 20px;
    display: flex;
    justify-content: center;
  }

  .side-image-link img {
    width: 160px;
  }
}
</style>
</head>

<body>

<!-- HERO -->
<section class="hero">

  <div class="links">
    <a href="art.html">Archive</a>
    <a href="info.html">Contact</a>
  </div>

  <!-- CENTER IMAGE -->
  <img id="randomImage" class="main-image" alt="Artwork">

  <!-- SIDE IMAGE -->
 

</section>

<script>
  const images = [
    "src/ternitzportrait1.JPG",
  ];

  let index = Math.floor(Math.random() * images.length);
  const img = document.getElementById("randomImage");

  img.src = images[index];

  img.addEventListener("click", () => {
    index = (index + 1) % images.length;
    img.src = images[index];
  });
</script>

</body>
</html>
