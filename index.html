<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: black;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}

/* IMAGE CONTAINER (NOT FULLSCREEN ANYMORE) */
.currently {
  position: fixed;
  left: 20px;
  top: 40%;
  transform: translateY(-50%);
  z-index: 10;

  font-family: "Courier New", monospace;
  font-size: 12px;
  color: white;
}

.currently a {
  color: white;
  text-decoration: underline;
}

  
  .hero {
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}

/* BIG IMAGE BUT NOT FULLSCREEN */
.hero img {
  max-width: 85vw;
  max-height: 80vh;
  object-fit: contain;
  border-radius: 8px;
  box-shadow: 0 10px 40px rgba(0,0,0,0.6);
}

/* Top centered buttons */
.links {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 10px;
  z-index: 10;
}

.links a {
  padding: 8px 16px;
  font-size: 0.9rem;
  text-decoration: none;
  color: white;
  background: rgba(0,0,0,0.4);
  border-radius: 5px;
}
</style>
</head>

<body>

<div class="links">
  <a href="art.html">Archive</a>
  <a href="info.html">Contact</a>
</div>

<!-- IMAGE DISPLAY -->
<section class="hero" id="hero">
  <img id="img" src="" alt="gallery image">
</section>

<div class="currently">
  Currently:
  <a href="https://dein-link.com">Add a link</a>
</div>
  
<script>
const images = [
  "src/20251006MarcusWagner4709.jpg",
  "src/painting_compilation/spagetti.jpg",
  "src/ghosttown2.jpg",
  "src/leibes_2.jpg",
  "src/works_on_paper_other26.jpg"
];

let index = Math.floor(Math.random() * images.length);

const img = document.getElementById("img");

// initial image
img.src = images[index];

// click to change image
document.getElementById("hero").addEventListener("click", () => {
  index = (index + 1) % images.length;
  img.src = images[index];
});
</script>

</body>
</html>
