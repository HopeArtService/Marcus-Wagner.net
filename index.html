<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gallery</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: white;
}

.hero {
  min-height: 300vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Top centered buttons (stacked) */
.links {
  position: fixed;
  top: 20px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  flex-direction: column; /* makes buttons vertical */
  gap: 10px;
  z-index: 10;
  align-items: center; /* keeps them centered */
}

.links a {
  padding: 8px 16px;
  font-size: 0.9rem;
  text-decoration: none;
  color: white;
  background: rgba(0,0,0,0.4);
  border-radius: 5px;
}

/* Center image */
.hero-content {
  display: flex;
  justify-content: center;
  align-items: center;
}

/* Small featured image */
.main-image {
  width: 180px;
  height: auto;
  object-fit: contain;
}

@media (max-width: 768px) {
  .main-image {
    width: 140px;
  }
}
</style>
</head>

<body>

<section class="hero">

  <div class="links">
    <a href="info.html">Info</a>
    <a href="art.html">Archive</a>
  </div>

  <div class="hero-content">
    <img
      src="src/ternitzportrait1.JPG"
      class="main-image"
      alt="Artwork"
    >
  </div>

</section>

</body>
</html>
