<!DOCTYPE HTML>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>info</title>

<style>
body {
    font-family: "Times New Roman", serif;
    margin: 40px;
    text-align: left;
    max-width: 700px;
}

/* Images (content images) */
img {
    width: 450px;
    height: auto;
    display: block;
    margin: 20px 0;
}

/* Links */
a {
    display: block;
    margin: 10px 0;
    color: red;
    text-decoration: none;
}

/* Paragraph spacing */
p {
    margin: 0 0 12px 0;
}

/* Bigger gap before Exhibitions */
.exhibitions-title {
    margin-top: 50px;
}

/* BACK HOME BUTTON */
.back-home {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 15px;
  text-decoration: none;
  border-radius: 5px;
  z-index: 1000;
  background-color: #eee;
  color: red;
  transition: background-color 0.3s;
}

.back-home:hover {
  background-color: #ccc;
}

/* NEW FLOATING IMAGE LINK (BOTTOM RIGHT, MORE INWARD) */
.side-image-link {
  position: fixed;
  right: 80px;   /* more inward from edge */
  bottom: 80px;  /* slightly above back-home button */
  z-index: 999;
  opacity: 0.9;
  transition: opacity 0.2s ease;
}

.side-image-link img {
  width: 160px;
  height: auto;
  display: block;
}

.side-image-link:hover {
  opacity: 1;
}

/* MOBILE */
@media (max-width: 768px) {
  .side-image-link {
    right: 20px;
    bottom: 100px;
  }

  .side-image-link img {
    width: 110px;
  }
}
</style>

</head>

<body>

<header>
</header>

<main>
<div>

<a href="mailto:marcuswagnerinfo@gmail.com">
  marcuswagnerinfo@gmail.com
</a>

</div>
</main>

<footer>
</footer>

<!-- FLOATING IMAGE LINK -->
<a href="https://www.hopeartservice.vip" class="side-image-link">
  <img src="src/hopenewlobo_visi.jpg" alt="Hope Art Service">
</a>

<!-- BACK HOME -->
<a href="/" class="back-home">Back to Home</a>

</body>
</html>
