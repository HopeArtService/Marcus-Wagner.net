
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcus Wagner – Kunst</title>

<style>
body {
    background-color: #00ffff;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    font-family: "Courier New", monospace;
    margin: 0;
    padding: 15px 0;
}

/* CRAZY CARD DESIGN */
.card {
    width: 96vw;
    max-width: 1400px;
    max-height: 90vh;
    background: linear-gradient(135deg, #ffcc00, #ff6600);
    border: 3px solid #0000ff;
    box-shadow: 5px 5px 0 #ff00ff;
    padding: 20px;
    color: #000;
    position: relative;
    overflow-y: auto;
    text-align: center;
    box-sizing: border-box;
}

.card img {
    display: block;
    width: auto;
    height: auto;
    max-width: 96%;
    max-height: 75vh;
    margin: 10px auto;
    border: 3px solid #0000ff;
    box-shadow: 2px 2px 0 #ff00ff;
    cursor: pointer;
    object-fit: contain;
    box-sizing: border-box;
}

.card h1 {
    font-size: 24px;
    margin: 0;
    color: #000080;
    text-shadow: 1px 1px #fff;
}

.card h2 {
    font-size: 16px;
    margin: 5px 0 15px;
    color: #ff0000;
}

.card p {
    font-size: 14px;
    margin: 5px 0;
}

/* SCROLLBAR */
.card::-webkit-scrollbar {
    width: 8px;
}

.card::-webkit-scrollbar-track {
    background: #ffcc00;
}

.card::-webkit-scrollbar-thumb {
    background: #0000ff;
    border: 1px solid #000;
}

/* BACK LINK */
.invisible-link {
    color: inherit;
    text-decoration: none;
}

.invisible-link:hover {
    text-decoration: underline;
}

/* IMAGE OVERLAY */
#overlay {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.8);
    display: none;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    z-index: 1000;
    box-sizing: border-box;
    padding: 20px;
}

#overlay img {
    display: block;
    max-width: 90vw;
    max-height: 78vh;
    width: auto;
    height: auto;
    object-fit: contain;
    box-shadow: 0 0 20px #fff;
    border: 5px solid #fff;
    border-radius: 5px;
    cursor: pointer;
}

#caption {
    margin-top: 15px;
    color: white;
    font-size: 16px;
    text-align: center;
    max-width: 80%;
    padding: 0 20px;
}

/* MOBILE */
@media (max-width: 767px) {
    body {
        align-items: flex-start;
        padding: 10px 0;
    }

    .card {
        max-height: none;
        padding: 12px;
    }

    .card img {
        max-width: 100%;
        max-height: none;
    }

    .card h1 {
        font-size: 22px;
    }

    #overlay img {
        max-width: 92vw;
        max-height: 75vh;
    }

    #caption {
        font-size: 13px;
    }
}
</style>
</head>

<body>

<div class="card">

    <h1>Painting Compilation</h1>
    <h2>2026, University of Applied Arts Vienna</h2>

    <!-- PAINTINGS AND INSTALLATION VIEWS -->

    <img
        src="src/painting_compilation/fleck.jpg"
        alt="Splash (small)"
        data-caption="Installationview Detail"
    >

    <img
        src="src/painting_compilation/spagetti.jpg"
        alt="Splash (small)"
        data-caption="Installationview Detail 2"
    >

    <img
        src="src/painting_compilation/install1.jpg"
        alt="Installation view"
        data-caption="Installationview 3"
    >

    <img
        src="src/painting_compilation/install2.jpg"
        alt="Installation view"
        data-caption="Installationview 4"
    >

    <img
        src="src/painting_compilation/spagettieater.jpg"
        alt="Spagettieater"
        data-caption="Spagettieater, Silkscreenprint and oil on Linen, 2025"
    >

    <img
        src="src/painting_compilation/fleck_cropped_smaller.jpg"
        alt="Splash (small)"
        data-caption="Splash (Small), Silkscreenprint on Linen, 2025"
    >

    <p>
        <a href="art.html" class="invisible-link">← Back</a>
    </p>

</div>

<!-- IMAGE OVERLAY -->
<div id="overlay">
    <img src="" alt="Vergrößertes Bild">
    <div id="caption"></div>
</div>

<script>
// CLICK ON IMAGES TO OPEN OVERLAY
const overlay = document.getElementById("overlay");
const overlayImg = overlay.querySelector("img");
const caption = document.getElementById("caption");

document.querySelectorAll(".card img").forEach(img => {
    img.addEventListener("click", (event) => {
        event.stopPropagation();

        overlayImg.src = img.src;
        overlayImg.alt = img.alt || "Vergrößertes Bild";
        caption.textContent = img.dataset.caption || img.alt || "";

        overlay.style.display = "flex";
    });
});

// CLICK OUTSIDE IMAGE TO CLOSE
overlay.addEventListener("click", () => {
    overlay.style.display = "none";
});

// PREVENT CLICKING THE IMAGE FROM CLOSING THE OVERLAY
overlayImg.addEventListener("click", (event) => {
    event.stopPropagation();
});

// CLOSE WITH ESCAPE KEY
document.addEventListener("keydown", (event) => {
    if (event.key === "Escape") {
        overlay.style.display = "none";
    }
});
</script>

</body>
</html>
