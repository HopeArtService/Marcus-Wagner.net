<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HopeTown</title>

<style>
body {
    background-color: #00ffff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: "Courier New", monospace;
    margin: 0;
}

.card {
    width: 88vw;
    max-width: 1200px;
    max-height: 90vh;
    background: linear-gradient(135deg, #ffcc00, #ff6600);
    border: 3px solid #0000ff;
    box-shadow: 5px 5px 0 #ff00ff;
    padding: 20px;
    color: #000;
    position: relative;
    overflow-y: auto;
    text-align: center;
}

.card img {
    display: block;
    width: 96%;
    max-width: 900px;
    height: auto;
    margin: 10px auto;
    border: 3px solid #0000ff;
    box-shadow: 2px 2px 0 #ff00ff;
    cursor: pointer;
}


.card h1 {
    font-size: 24px;
    margin: 0;
    color: #000080;
    text-shadow: 1px 1px #fff;
}

.card h2 {
    font-size: 16px;
    margin: 5px 0 15px;
    color: #ff0000;
}

.card p {
    font-size: 14px;
    margin: 5px 0;
}

/* Scrollbar */
.card::-webkit-scrollbar {
    width: 8px;
}

.card::-webkit-scrollbar-track {
    background: #ffcc00;
}

.card::-webkit-scrollbar-thumb {
    background: #0000ff;
    border: 1px solid #000;
}

.invisible-link {
    color: inherit;
    text-decoration: none;
}

.invisible-link:hover {
    text-decoration: underline;
}



/* Overlay */
#overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0,0,0,0.9);
    display: none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index: 1000;
}

#overlay img {
    max-width: 90%;
    max-height: 85%;
    box-shadow: 0 0 20px #fff;
    border: 5px solid #fff;
}

#caption {
    margin-top: 15px;
    color: white;
    font-size: 16px;
    text-align: center;
    max-width: 80%;
    padding: 0 20px;
}

</style>
</head>
<body>

    <img src="src/ghosttown_neu/install4.jpg" alt="Installationsansicht 4" data-caption="Installationsansicht 4">
    <img src="src/ghosttown_neu/install5_mask.jpg" alt="Installation mit Maske" data-caption="Installation mit Maske">
    <img src="src/ghosttown_neu/face1.jpg" alt="Gesicht Detail 1" data-caption="How to be blind, Mixed media, 2026">

    <img src="src/ghosttown_neu/hopetown_full.jpg" alt="Hope Town Gesamtansicht" data-caption="Hope Town Gesamtansicht">
    <img src="src/ghosttown_neu/hopetown_closer.jpg" alt="Hope Town Detailansicht" data-caption="Hope Town Detailansicht">

</div>

<!-- Overlay -->
<div id="overlay">
    <img src="" alt="Vergrößertes Bild">
    <div id="caption"></div>
</div>

<script>

const overlay = document.getElementById("overlay");
const overlayImg = overlay.querySelector("img");
const caption = document.getElementById("caption");

const images = Array.from(document.querySelectorAll(".card img"));

let currentIndex = 0;

function updateImage() {
    overlayImg.src = images[currentIndex].src;

    if (caption) {
        caption.textContent =
            images[currentIndex].dataset.caption ||
            images[currentIndex].alt ||
            "";
    }
}

function showImage(index) {
    currentIndex = index;
    updateImage();
    overlay.style.display = "flex";
}

images.forEach((img, index) => {
    img.addEventListener("click", () => {
        showImage(index);
    });
});

function nextImage() {
    currentIndex = (currentIndex + 1) % images.length;
    updateImage();
}

function prevImage() {
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateImage();
}

document.addEventListener("keydown", (e) => {

    if (overlay.style.display !== "flex") return;

    if (e.key === "ArrowRight") nextImage();
    if (e.key === "ArrowLeft") prevImage();

    if (e.key === "Escape") {
        overlay.style.display = "none";
    }
});

overlay.addEventListener("click", (e) => {
    if (e.target === overlay) {
        overlay.style.display = "none";
    }
});

/* Swipe für Mobilgeräte */

let touchStartX = 0;
let touchEndX = 0;

overlay.addEventListener("touchstart", (e) => {
    touchStartX = e.changedTouches[0].screenX;
});

overlay.addEventListener("touchend", (e) => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
});

function handleSwipe() {
    if (touchEndX < touchStartX - 50) {
        nextImage();
    }

    if (touchEndX > touchStartX + 50) {
        prevImage();
    }
}

/* Klick auf Bild = nächstes Bild */

overlayImg.addEventListener("click", (e) => {
    e.stopPropagation();
    nextImage();
});

</script>

</body>
</html>
