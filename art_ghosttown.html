<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HopeTown</title>

<style>
body {
    background-color: #00ffff;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: "Courier New", monospace;
    margin:0;
}

  
    
.card {
    width: 350px;
    max-height: 600px;
    background: linear-gradient(135deg, #ffcc00, #ff6600);
    border: 3px solid #0000ff;
    box-shadow: 5px 5px 0 #ff00ff;
    padding: 20px;
    color: #000;
    position: relative;
    overflow-y: auto;
    text-align: center;
}

/* Desktop */
@media (min-width: 768px) {
    .card {
        width: 900px; /* vorher 350px */
    }
}

.card h1 {
    font-size: 24px;
    margin: 0;
    color: #000080;
    text-shadow: 1px 1px #fff;
}

.card h2 {
    font-size: 16px;
    margin: 5px 0 15px;
    color: #ff0000;
}

.card p {
    font-size:14px;
    margin:5px 0;
}

/* Scrollbar */
.card::-webkit-scrollbar { width: 8px; }
.card::-webkit-scrollbar-track { background: #ffcc00; }
.card::-webkit-scrollbar-thumb { background: #0000ff; border:1px solid #000; }

.invisible-link {
    color: inherit;
    text-decoration: none;
}
.invisible-link:hover { text-decoration: underline; }

/* Bilder in voller Breite innerhalb der Karte */
.card img {
    width: 95%;
    margin: 10px 0;
    border: 3px solid #0000ff;
    box-shadow: 2px 2px 0 #ff00ff;
    cursor: pointer;
    object-fit: cover;
}

/* Overlay für vergrößertes Bild */
#overlay {
    position: fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background: rgba(0,0,0,0.9);
    display:none;
    justify-content: center;
    align-items: center;
    z-index:1000;
}

#overlay img {
    max-width: 90%;
    max-height: 90%;
    box-shadow: 0 0 20px #fff;
    border: 5px solid #fff;
}

#overlay {
    position: fixed;
    top:0;
    left:0;
    width:100vw;
    height:100vh;
    background: rgba(0,0,0,0.9);
    display:none;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    z-index:1000;
}

#overlay img {
    max-width: 90%;
    max-height: 85%;
    box-shadow: 0 0 20px #fff;
    border: 5px solid #fff;
}

#caption {
    margin-top: 15px;
    color: white;
    font-size: 16px;
    text-align: center;
    max-width: 80%;
    padding: 0 20px;
}    

.nav {
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    font-size:50px;
    color:white;
    cursor:pointer;
    user-select:none;
    padding:20px;
}

.prev { left:20px; }
.next { right:20px; }

.work {
    text-align: left;      /* Link linksbündig unter dem Bild */
    margin-bottom: 15px;   /* Abstand zu nächstem Bild */
}

.work img {
    display: block;        /* verhindert, dass der Link neben dem Bild erscheint */
    width: 95%;
    margin-bottom: 5px;    /* kleiner Abstand zwischen Bild und Link */
}

.work a {
    text-decoration: none;
    color: #0000ff;        /* Linkfarbe anpassen */
    font-size: 14px;
}

.work a:hover {
    text-decoration: underline;
}
    
</style>
</head>
<body>

<div class="card">
    <h1>Ghost City - Hope Town</h1>
    <h2>Installation, University of Applied Arts Vienna, 2026</h2>

    <!-- Bilder in voller Breite -->
    <img src="src/ghosttown_neu/install1.jpg" alt="Artwork 1"  <div id="caption">Installationsview 1</div>>
     <img src="src/ghosttown_neu/install2.jpg" alt="Artwork 1">
      <img src="src/ghosttown_neu/mask1.jpg" alt="Artwork 1">

    <img src="src/ghosttown_neu/install3.jpg" alt="Artwork 1">
    <img src="src/ghosttown_neu/install4.jpg" alt="Artwork 1">
    <img src="src/ghosttown_neu/install5_mask.jpg">
     <img src="src/ghosttown_neu/face1.jpg" alt="Artwork 1">
    <img src="src/ghosttown_neu/face2.jpg" alt="Artwork 1">
    <img src="src/ghosttown_neu/hopetown_full.jpg" alt="Artwork 1">

    <p><a href="art.html" class="invisible-link">← Back</a></p>
</div>

<!-- Overlay für vergrößertes Bild -->
<div id="overlay">
    <img src="" alt="Vergrößertes Bild">

</div>

<script>
const overlay = document.getElementById("overlay");
const overlayImg = overlay.querySelector("img");
const caption = document.getElementById("caption");

const images = Array.from(document.querySelectorAll(".card img"));

let currentIndex = 0;

function updateImage() {
    overlayImg.src = images[currentIndex].src;
    caption.textContent =
        images[currentIndex].dataset.caption ||
        images[currentIndex].alt ||
        "";
}

function showImage(index){
    currentIndex = index;
    updateImage();
    overlay.style.display = "flex";
}

images.forEach((img,index)=>{
    img.addEventListener("click",()=>{
        showImage(index);
    });
});

function nextImage(){
    currentIndex = (currentIndex + 1) % images.length;
    updateImage();
}

function prevImage(){
    currentIndex = (currentIndex - 1 + images.length) % images.length;
    updateImage();
}

document.addEventListener("keydown",(e)=>{
    if(overlay.style.display !== "flex") return;

    if(e.key === "ArrowRight") nextImage();
    if(e.key === "ArrowLeft") prevImage();
    if(e.key === "Escape") overlay.style.display = "none";
});

overlay.addEventListener("click",(e)=>{
    if(e.target === overlay){
        overlay.style.display = "none";
    }
});

let touchStartX = 0;
let touchEndX = 0;

overlay.addEventListener("touchstart",(e)=>{
    touchStartX = e.changedTouches[0].screenX;
});

overlay.addEventListener("touchend",(e)=>{
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
});

function handleSwipe(){
    if(touchEndX < touchStartX - 50) nextImage();
    if(touchEndX > touchStartX + 50) prevImage();
}

overlayImg.addEventListener("click",(e)=>{
    e.stopPropagation();
    nextImage();
});

</script>

</body>
</html>
