```html
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Courier New", monospace;
    margin: 0;
    padding: 30px 15px;
    background: white;
    color: black;
    text-align: center;
}

/* CENTRAL IMAGE */
.work {
    width: 100%;
    max-width: 900px;
    margin: 20px auto 0;
}

.image-button {
    display: block;
    width: 100%;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
}

.work img {
    display: block;
    width: 85%;
    height: auto;
    margin: 0 auto;
    object-fit: contain;
}

/* TEXT UNDER IMAGE */
.caption {
    font-size: 13px;
    line-height: 1.5;
    margin: 12px auto 0;
    text-align: center;
}

/* BACK HOME BUTTON */
.back-home {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 15px;
    text-decoration: none;
    border-radius: 5px;
    z-index: 1000;
    background-color: #eee;
    color: black;
    transition: background-color 0.3s;
}

.back-home:hover {
    background-color: #ccc;
}

/* MOBILE */
@media (max-width: 600px) {
    body {
        padding: 20px 12px;
    }

    .work img {
        width: 100%;
    }

    .caption {
        font-size: 12px;
    }

    .back-home {
        bottom: 15px;
        right: 15px;
    }
}
</style>
</head>

<body>

<div class="work">

    <button
        type="button"
        class="image-button"
        id="nextImage"
        aria-label="Next image"
    >
        <img
            id="galleryImage"
            src="src/radierungen/texas_1.jpg"
            alt="Texas Sun"
        >
    </button>

    <p class="caption" id="imageCaption">
        Texas Sun, Etching, 2025
    </p>

</div>

<a href="index.html" class="back-home">Back Home</a>

<script>
const images = [
    {
        src: "src/radierungen/texas_1.jpg",
        alt: "Texas Sun",
        caption: "Texas Sun, Etching, 2025"
    },
    {
        src: "src/painting_compilation/spagettieater.jpg",
        alt: "Texas Sun 2",
        caption: "Texas Sun 2, Etching, 2025"
    },
    {
        src: "src/dontgiveup/3E4C2886.jpg",
        alt: "Texas Sun 3",
        caption: "Texas Sun 3, Etching, 2025"
    }
];

let currentIndex = 0;

const galleryImage = document.getElementById("galleryImage");
const imageCaption = document.getElementById("imageCaption");
const nextImage = document.getElementById("nextImage");

nextImage.addEventListener("click", function () {
    currentIndex = (currentIndex + 1) % images.length;

    galleryImage.src = images[currentIndex].src;
    galleryImage.alt = images[currentIndex].alt;
    imageCaption.textContent = images[currentIndex].caption;
});
</script>

</body>
</html>
