<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For access to full archive, contact me</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Courier New", monospace;
    margin: 0;
    padding: 30px 15px;
    background: white;
    color: black;
    text-align: center;
}

/* MAIN TITLE */
h1 {
    font-size: 32px;
    font-weight: normal;
    margin: 20px 0 35px;
}

/* CENTRAL IMAGE */
.work {
    width: 100%;
    max-width: 900px;
    margin: 0 auto;
}

.work img {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto;
    object-fit: contain;
}

/* TEXT UNDER IMAGE */
.caption {
    font-size: 13px;
    line-height: 1.5;
    margin: 12px auto 0;
    text-align: center;
}

/* BACK HOME BUTTON */
.back-home {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 15px;
    text-decoration: none;
    border-radius: 5px;
    z-index: 1000;
    background-color: #eee;
    color: black;
    transition: background-color 0.3s;
}

.back-home:hover {
    background-color: #ccc;
}

/* MOBILE */
@media (max-width: 600px) {
    body {
        padding: 20px 12px;
    }

    h1 {
        font-size: 25px;
        margin: 20px 0 25px;
    }

    .caption {
        font-size: 12px;
    }

    .back-home {
        bottom: 15px;
        right: 15px;
    }
}
</style>
</head>

<body>

<h1>Marcus Wagner</h1>

<div class="work">
    <img
        src="src/radierungen/texas_1.jpg"
        alt="Texas Sun"
    >

    <p class="caption">
       Texas Sun, Etching, 2025
    </p>
</div>

<a href="index.html" class="back-home">Back Home</a>

</body>
</html>
