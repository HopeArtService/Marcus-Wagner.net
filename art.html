<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Archive</title>

<style>
* {
    box-sizing: border-box;
}

body {
    font-family: "Courier New", monospace;
    margin: 0;
    padding: 30px 15px;
    background: white;
    color: black;
    text-align: center;
}

/* CENTRAL IMAGE */
.work {
    width: 100%;
    max-width: 900px;
    margin: 20px auto 0;
}

.image-button {
    display: block;
    width: 100%;
    padding: 0;
    border: none;
    background: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
}

.work img {
    display: block;
    width: auto;
    height: auto;
    max-width: 85vw;
    max-height: 75vh;
    object-fit: contain;
    margin: 0 auto;
}

/* TEXT UNDER IMAGE */
.caption {
    font-size: 13px;
    line-height: 1.5;
    margin: 12px auto 0;
    text-align: center;
}

/* BACK HOME BUTTON */
.back-home {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 10px 15px;
    text-decoration: none;
    border-radius: 5px;
    z-index: 1000;
    background-color: #eee;
    color: black;
    transition: background-color 0.3s;
}

.back-home:hover {
    background-color: #ccc;
}

/* MOBILE */
@media (max-width: 600px) {
    body {
        padding: 20px 12px;
    }

    .work img {
        width: 100%;
    }

    .caption {
        font-size: 12px;
    }

    .back-home {
        bottom: 15px;
        right: 15px;
    }
}
</style>
</head>

<body>

<div class="work">

    <button
        type="button"
        class="image-button"
        id="nextImage"
        aria-label="Nächstes Bild anzeigen"
    >
        <img
            id="galleryImage"
            src="src/radierungen/texas_1.jpg"
            alt="Texas Sun"
        >
    </button>

    <p class="caption" id="imageCaption">
        Texas Sun, Etching, 2025
    </p>

</div>


<a href="index.html" class="back-home">Back Home</a>


<script>
const images = [
    {
        src: "src/radierungen/texas_1.jpg",
        alt: "Texas Sun",
        caption: "Texas Sun, Etching, 2025"
    },
    {
        src: "src/painting_compilation/spagettieater.jpg",
        alt: "Spagettieater",
        caption: "Spagettieater, Silkscreenprint and oil on Linen, 2025"
    },
    {
        src: "src/dontgiveup/3E4C2886.jpg",
        alt: "Collage 1",
        caption: "Collage 1; Steel, Cake Form, Magnets, Drawing, Plastic Sheet, 2026"
    },
    {
        src: "src/dontgiveup/3E4C3156.jpg",
        alt: "Collage 1",
        caption: "Collage 1; Steel, Cake Form, Magnets, Drawing, Plastic Sheet, 2026"
    },
    {
        src: "src/Scan 10.jpg",
        alt: "Untitled",
        caption: "Untitled; 21x29cm, Paper, 2024"
    },
    {
        src: "src/ghosttown2.jpg",
        alt: "Ghost City",
        caption: "Ghost City – Hope Town, 2026"
    },
    {
        src: "src/hmarriage_closeup.jpeg",
        alt: "Self Marriage",
        caption: "Self Marriage; 21x21cm, Digital Print, 2025"
    },
    {
        src: "src/leibes_2.jpg",
        alt: "Installationview",
        caption: "Installationview, Tomb; Die Besten Leibesübungen, University of Applied Arts, 2023"
    },
    {
        src: "src/pirate_1_crazy.jpg",
        alt: "Apocalypse 2",
        caption: "Apocalypse 2; Mixed Media, 2026"
    }
];

let currentIndex = 0;

const galleryImage = document.getElementById("galleryImage");
const imageCaption = document.getElementById("imageCaption");
const nextImage = document.getElementById("nextImage");

nextImage.addEventListener("click", function () {
    const nextIndex = (currentIndex + 1) % images.length;
    const next = images[nextIndex];

    const preload = new Image();

    preload.onload = function () {
        galleryImage.src = next.src;
        galleryImage.alt = next.alt;
        imageCaption.textContent = next.caption;
        currentIndex = nextIndex;
    };

    preload.onerror = function () {
        alert("Bild konnte nicht geladen werden: " + next.src);
    };

    preload.src = next.src;
});
</script>

</body>
</html>
